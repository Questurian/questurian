name: CI

# Machine-shaped guarantee for what was previously gated by hand: every PR runs
# the suites that were run manually before merging, plus the two checks that a
# green test run does not give you (typecheck and lint).
#
# Jobs are split so a failure names the thing that broke rather than "CI".

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Satisfies apps/questura/apps/server engines (^18.20.2 || >=20.9.0). pnpm
  # comes from the root package.json "packageManager" field.
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.13'

jobs:
  questura-softprod:
    name: Questura softprod scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Two of the softprod suites assert on script contents with ripgrep.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Pure shell; deliberately no `pnpm install`. (test:deploy looks like it
      # belongs here too, but check-pending-migrations.mjs imports dotenv, so it
      # runs in the job that installs.)
      - name: Softprod shell suites
        run: pnpm --dir apps/questura/apps/server run test:softprod

  questura-server:
    name: Questura server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @questura/server...

      - name: Migration guard tests
        run: pnpm --dir apps/questura/apps/server run test:deploy

      - name: Unit tests
        run: pnpm --dir apps/questura/apps/server run test:int

  questura-server-build:
    name: Questura server build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @questura/server...

      # A green test run, a clean typecheck and a green lint all passed while
      # `next build` was broken: `instrumentation.ts` was rewritten to use an
      # early return instead of wrapping its body in a
      # `NEXT_RUNTIME === 'nodejs'` block, which left Payload's config
      # reachable from the *edge* bundle and made it try to resolve `crypto`,
      # `fs` and `path`. Nothing but the build says so, so the build runs.
      #
      # Placeholders only. Nothing here connects to anything: the build needs
      # these variables to exist because module scope reads them, not because
      # it uses them.
      - name: Production build
        env:
          NODE_ENV: production
          DATABASE_URI: postgres://build:build@127.0.0.1:5432/build
          DATABASE_URI_UNPOOLED: postgres://build:build@127.0.0.1:5432/build
          PAYLOAD_SECRET: ci-build-placeholder-not-a-secret-00000000
          BETTER_AUTH_SECRET: ci-build-placeholder-not-a-secret-11111111
          # Page-data collection evaluates module scope, and the visitor-auth
          # module refuses to load in production without this. Nothing
          # connects: no Redis is started for this job.
          REDIS_URL: redis://127.0.0.1:6390
          NEXT_DIST_DIR: .next-ci
        run: pnpm --dir apps/questura/apps/server run build

      # The build rewrites the tsconfig include list, which is expected and
      # not committed. A change under `src/` would mean the build rewrote
      # source, which is worth knowing about.
      - name: The build did not rewrite source
        run: git diff --exit-code -- apps/questura/apps/server/src

  # The readiness integration tests, where a skip is a failure (surge plan
  # L09). Everything else in CI stays green on a machine with no database, so
  # these used to skip quietly and a green run said nothing about them. Here a
  # disposable Postgres and Redis are part of the job, the schema comes from
  # the committed fixture (no developer dump), the launch corpus is seeded
  # through Payload's own Local API, and `readiness:required` fails on any
  # skipped, pending or missing integration test.
  questura-readiness:
    name: Questura readiness integrations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6390:6379']
    env:
      READINESS_DATABASE_URI: postgres://postgres:postgres@127.0.0.1:5432/questura_readiness
      READINESS_REDIS_URL: redis://127.0.0.1:6390
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @questura/server...

      - name: Preflight
        run: pnpm --dir apps/questura/apps/server readiness check

      - name: Schema from the committed fixture
        run: pnpm --dir apps/questura/apps/server readiness bootstrap

      - name: Launch corpus
        run: pnpm --dir apps/questura/apps/server readiness:launch -- seed

      - name: Integration tests (skips fail)
        run: pnpm --dir apps/questura/apps/server readiness:required

  questura-client:
    name: Questura client tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Deliberately no `pnpm install`: these are node:test suites over pure
      # modules, and node strips the TypeScript itself (needs >= 22.18, or the
      # --experimental-strip-types the script passes). Nothing here imports a
      # dependency, which is the constraint that keeps the job this cheap.
      - name: Unit tests
        run: pnpm --dir apps/questura/apps/client run test

      # The load supervisor's stop rules (surge plan L08): pure node:test, no
      # install. The negative controls need k6 and run locally.
      - name: Load supervisor policy
        run: node --test apps/questura/load/k6/supervisor/policy.test.mjs

  writer-web:
    name: Writer frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/ai-blog-writer
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @questurian/ai-blog-writer

      # Cheapest checks first, so an obvious break fails fast.
      - name: Module boundaries
        run: node apps/frontend/scripts/check-boundaries.cjs

      - name: Lint
        run: ./node_modules/.bin/eslint apps/frontend/src --ext .ts,.tsx

      # A green test run does not imply the branch typechecks on its own; that
      # is exactly the gap this gate exists to close.
      - name: Typecheck
        run: ./node_modules/.bin/tsc -p apps/frontend/tsconfig.json --noEmit

      - name: Tests
        run: ./node_modules/.bin/vitest run --config apps/frontend/vite.config.ts

  writer-api:
    name: Writer backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('apps/ai-blog-writer/apps/backend/requirements*.txt') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        working-directory: apps/ai-blog-writer
        run: |
          uv venv --python "$(command -v python)" --allow-existing .venv
          uv pip install --python .venv/bin/python \
            -r apps/backend/requirements.txt \
            -r apps/backend/requirements-dev.txt

      - name: Tests
        working-directory: apps/ai-blog-writer/apps/backend
        # tests/conftest.py already redirects DATA_DIR to a temp dir before any
        # app module is imported. This is the second lock on the same door: the
        # backend writes pipeline.db under DATA_DIR, and a suite that reached a
        # real data directory once cost real data. (Step-level env because the
        # runner context is not available in job-level env.)
        env:
          DATA_DIR: ${{ runner.temp }}/abw-test-data
        run: ../../.venv/bin/python -m pytest tests/ -q
