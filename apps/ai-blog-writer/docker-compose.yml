services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - apps/backend/.env
    environment:
      - PAYLOAD_API_URL=http://host.docker.internal:4000
      # Pin the SQLite data dir to the named volume below so run history
      # and generated articles survive container rebuilds (overrides any
      # DATA_DIR in apps/backend/.env).
      - DATA_DIR=/data
    volumes:
      - ./:/app
      - backend_data:/data
      - ~/.config/gcloud:/root/.config/gcloud:ro  # Mount GCloud credentials
    ports:
      - '4003:4003'

  converter:
    build:
      context: .
      dockerfile: apps/converter/Dockerfile
    volumes:
      - ./apps/converter:/app/apps/converter
      - converter_node_modules:/app/apps/converter/node_modules
    ports:
      - '4010:4010'

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      - VITE_API_BASE_URL=http://localhost:4003
      - VITE_CONVERTER_URL=http://localhost:4010
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - '3003:3003'
    depends_on:
      - backend
      - converter

volumes:
  frontend_node_modules:
  converter_node_modules:
  backend_data:
